<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080" viewBox="0 0 1500 1080"><rect width="1500" height="1080" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#163247} .wire{fill:none;stroke:#235e86;stroke-width:3;stroke-linejoin:round} .box{fill:#eff7fb;stroke:#235e86;stroke-width:2}</style><text x="45" y="48" font-size="32">GP2Y dust sensor + ESP32-S3 | BC337 revision</text><text x="45" y="82" font-size="20">Node3 first  |  GPIO2: analogue input  |  GPIO6: LED pulse control  |  2026-10-10</text><rect x="1110" y="125" width="345" height="490" rx="10" class="box"/><text x="1130" y="160" font-size="25">GP2Y1014AU0F</text><text x="1130" y="189" font-size="17">Confirm actual sensor model</text><text x="1130" y="227" font-size="20">6  VCC</text><text x="1130" y="327" font-size="20">1  V-LED</text><text x="1130" y="437" font-size="20">3  LED (sink control)</text><text x="1130" y="527" font-size="20">5  Vo (analogue out)</text><text x="1130" y="572" font-size="20">2  LED-GND</text><text x="1130" y="602" font-size="20">4  S-GND</text><text x="65" y="220" font-size="22" style="fill:#b33f24">ESP32 5V / USB 5V</text><polyline points="300,220 1110,220" class="wire" style="stroke:#b33f24"/><polyline points="350,220 350,320 455,320" class="wire" style="stroke:#b33f24"/><circle cx="350" cy="220" r="5" fill="#235e86"/><polyline points="455,320 470,320" class="wire" style="stroke:#235e86"/><polyline points="530,320 545,320" class="wire" style="stroke:#235e86"/><rect x="470" y="311" width="60" height="18" fill="white" stroke="#235e86" stroke-width="2"/><text x="452" y="300" font-size="19">R1 150 ohm</text><polyline points="545,320 1110,320" class="wire" style="stroke:#b33f24"/><circle cx="900" cy="320" r="5" fill="#235e86"/><polyline points="900,320 900,350" class="wire" style="stroke:#235e86"/><polyline points="880,350 920,350" class="wire" style="stroke:#235e86"/><polyline points="880,365 920,365" class="wire" style="stroke:#235e86"/><polyline points="900,365 900,402" class="wire" style="stroke:#235e86"/><text x="930" y="357" font-size="19">+ C1 220 uF</text><text x="930" y="382" font-size="17">10 V or higher</text><text x="910" y="408" font-size="17">GND</text><text x="880" y="345" font-size="18">+</text><text x="55" y="445" font-size="22">ESP32 GPIO6</text><polyline points="245,440 310,440" class="wire" style="stroke:#235e86"/><polyline points="310,440 325,440" class="wire" style="stroke:#235e86"/><polyline points="385,440 400,440" class="wire" style="stroke:#235e86"/><rect x="325" y="431" width="60" height="18" fill="white" stroke="#235e86" stroke-width="2"/><text x="307" y="420" font-size="19">R2 1k</text><polyline points="400,440 575,440" class="wire" style="stroke:#235e86"/><circle cx="460" cy="440" r="5" fill="#235e86"/><polyline points="460,440 460,490" class="wire" style="stroke:#235e86"/><polyline points="460,490 460,505" class="wire" style="stroke:#235e86"/><polyline points="460,545 460,560" class="wire" style="stroke:#235e86"/><rect x="451" y="505" width="18" height="40" fill="white" stroke="#235e86" stroke-width="2"/><text x="478" y="532" font-size="19">R3 10k</text><polyline points="460,560 460,590" class="wire" style="stroke:#235e86"/><text x="443" y="615" font-size="17">GND</text><polyline points="575,409 575,471" class="wire" style="stroke:#235e86"/><polyline points="575,425 635,388 635,365 760,365 760,430 1110,430" class="wire" style="stroke:#235e86"/><polyline points="575,455 635,489 635,555" class="wire" style="stroke:#235e86"/><polygon points="626,484 610,482 618,469" fill="#235e86"/><text x="651" y="494" font-size="19">E</text><text x="641" y="382" font-size="19">C</text><text x="553" y="405" font-size="19">B</text><text x="670" y="462" font-size="22">Q1 BC337 (NPN)</text><text x="618" y="580" font-size="17">GND</text><text x="55" y="695" font-size="22">ESP32 GPIO2</text><polyline points="245,690 610,690 815,690" class="wire" style="stroke:#235e86"/><polyline points="815,690 830,690" class="wire" style="stroke:#235e86"/><polyline points="890,690 905,690" class="wire" style="stroke:#235e86"/><rect x="830" y="681" width="60" height="18" fill="white" stroke="#235e86" stroke-width="2"/><text x="812" y="670" font-size="19">R4 10k</text><polyline points="905,690 1060,690 1060,520 1110,520" class="wire" style="stroke:#235e86"/><circle cx="610" cy="690" r="5" fill="#235e86"/><polyline points="610,690 610,725" class="wire" style="stroke:#235e86"/><polyline points="610,725 610,740" class="wire" style="stroke:#235e86"/><polyline points="610,780 610,795" class="wire" style="stroke:#235e86"/><rect x="601" y="740" width="18" height="40" fill="white" stroke="#235e86" stroke-width="2"/><text x="628" y="767" font-size="19">R5 10k</text><polyline points="610,795 610,820" class="wire" style="stroke:#235e86"/><text x="591" y="843" font-size="17">GND</text><polyline points="1110,565 1090,565 1090,790 1360,790" class="wire" style="stroke:#235e86"/><polyline points="1110,595 1090,595" class="wire" style="stroke:#235e86"/><circle cx="1090" cy="595" r="5" fill="#235e86"/><text x="1240" y="818" font-size="19">COMMON GND</text><text x="60" y="757" font-size="22">Vo x 0.5 enters GPIO2</text><text x="60" y="788" font-size="22">Firmware gain = 2.0</text><text x="60" y="867" font-size="21">All GND labels connect together, including ESP32 GND.</text><rect x="40" y="894" width="1420" height="150" rx="8" fill="#fff6e9" stroke="#b88137"/><text x="60" y="924" font-size="22">Wiring notes</text><text x="60" y="956" font-size="19">1. C1 positive goes to pin 1 AFTER R1; C1 negative goes to GND. Pin 6 connects directly to 5V.</text><text x="60" y="987" font-size="19">2. Verify Q1 C/B/E against the supplier pinout. This symbol does NOT show physical pin order.</text><text x="60" y="1018" font-size="19">3. Do not bypass R4/R5. LED target: 320 us ON / 10 ms cycle; sample near 280 us. Verify on hardware.</text></svg>